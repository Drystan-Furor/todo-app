spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/todo_app}
    username: ${DB_USERNAME:todo}
    password: ${DB_PASSWORD:todo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-production-please-32bytes}
    expiration: ${APP_JWT_EXPIRATION:3600000}
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:604800000}
