spring:
  datasource:
    url: jdbc:h2:file:./data/todo-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: change-me-in-production-please-32bytes
    expiration: 3600000
    refresh-expiration: 604800000
